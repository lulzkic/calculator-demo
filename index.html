<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIT Instant Calculator</title>
    <style>
        /* RIT Brand Palette Mapping:
           Primary: #F76902 (RIT Orange), #FFFFFF (White)
           Secondary: #000000 (Black), #D0D3D4 (PMS 427C), #A2AAAD (PMS 429C), #7C878E (PMS 430C)
           Accents: #DA291C (PMS 485C - Red for Clear)
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #F4F4F4; /* Light background to make the black/orange pop */
            color: #000000;
            padding: 20px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 4px solid #F76902; /* RIT Orange accent */
            padding-bottom: 8px;
        }

        .calculator {
            background: #000000; /* RIT Black */
            border-radius: 8px; /* Sharper, more professional corners */
            padding: 24px;
            width: 340px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .display {
            background: #FFFFFF;
            border: 2px solid #7C878E; /* PMS 430C */
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .display .previous {
            font-size: 0.9rem;
            color: #7C878E; /* PMS 430C */
            min-height: 1.2em;
            word-break: break-all;
            margin-bottom: 4px;
        }

        .display .current {
            font-size: 2.4rem;
            font-weight: 700;
            color: #000000;
            word-break: break-all;
            line-height: 1.1;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px 10px;
            font-size: 1.2rem;
            font-family: inherit;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-weight: 600;
            background: #D0D3D4; /* PMS 427C - Light Neutral */
            color: #000000;
        }

        button:hover {
            background: #A2AAAD; /* PMS 429C */
        }

        button:active {
            transform: translateY(2px);
        }

        /* Operators use the Primary RIT Orange */
        button.operator {
            background: #F76902;
            color: #FFFFFF;
        }

        button.operator:hover {
            background: #D65A00; /* Darker shade of RIT Orange */
        }

        /* Clear uses Accent Red */
        button.clear {
            background: #DA291C;
            color: #FFFFFF;
        }

        button.clear:hover {
            background: #B51F15;
        }

        /* Equals uses Primary RIT Orange with a border to emphasize it */
        button.equals {
            background: #F76902;
            color: #FFFFFF;
            box-shadow: 0 0 0 2px #FFFFFF inset;
        }

        button.equals:hover {
            background: #D65A00;
        }

        button.wide {
            grid-column: span 2;
        }

        /* Utility button for backspace using a mid-gray */
        .backspace-btn {
            background: #A2AAAD;
            color: #FFFFFF;
        }

        .footer {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #7C878E;
            text-align: center;
        }

        .footer b {
            color: #F76902;
        }

        .footer a {
            color: #000000;
            text-decoration: underline;
            font-weight: 600;
        }

        .footer a:hover {
            color: #F76902;
        }
    </style>
</head>
<body>

    <h1>RIT Instant Calculator</h1>

    <div class="calculator">
        <div class="display">
            <div class="previous" id="previous"></div>
            <div class="current" id="current">0</div>
        </div>
        <div class="buttons">
            <button class="clear wide" onclick="clearAll()">Clear</button>
            <button class="backspace-btn" onclick="backspace()">&#9003;</button>
            <button class="operator" onclick="setOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="setOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="setOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="setOperator('+')">+</button>

            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals wide" onclick="calculate()">=</button>
        </div>
    </div>

    <p class="footer">
        Built for <b>MGIS 360</b> &middot; Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
    </p>

    <script>
        let current = '0';
        let previous = '';
        let operator = null;
        let resetNext = false;

        function updateDisplay() {
            document.getElementById('current').textContent = current;
            document.getElementById('previous').textContent = previous;
        }

        function appendNumber(num) {
            if (resetNext) {
                current = '0';
                resetNext = false;
            }
            if (num === '.' && current.includes('.')) return;
            if (current === '0' && num !== '.') {
                current = num;
            } else {
                current += num;
            }
            updateDisplay();
        }

        function setOperator(op) {
            if (operator && !resetNext) {
                calculate();
            }
            const symbols = {'/': '÷', '*': '×', '-': '−', '+': '+'};
            previous = current + ' ' + symbols[op];
            operator = op;
            resetNext = true;
            updateDisplay();
        }

        function calculate() {
            if (!operator) return;
            const a = parseFloat(previous);
            const b = parseFloat(current);
            let result;

            switch (operator) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/': result = b === 0 ? 'Error' : a / b; break;
            }

            if (result === 'Error') {
                current = 'Error';
            } else {
                result = Math.round(result * 1e10) / 1e10;
                current = result.toString();
            }

            previous = '';
            operator = null;
            resetNext = true;
            updateDisplay();
        }

        function clearAll() {
            current = '0';
            previous = '';
            operator = null;
            resetNext = false;
            updateDisplay();
        }

        function backspace() {
            if (resetNext) return;
            current = current.length > 1 ? current.slice(0, -1) : '0';
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '.') appendNumber('.');
            else if (e.key === '+') setOperator('+');
            else if (e.key === '-') setOperator('-');
            else if (e.key === '*') setOperator('*');
            else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Backspace') backspace();
            else if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
